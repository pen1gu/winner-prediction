<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Winner Prediction — Web Demo</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Winner Prediction Web Demo</h1>
      <p>
        FastAPI 라우터(<code>/api/v1</code>)에서 최근 경기·예측·시각화 데이터를 불러옵니다.
        서버 실행: <code>poetry run uvicorn server.app.main:app --reload</code> 후 이 페이지를 연다.
      </p>
    </header>

    <section class="controls">
      <label for="limitSelect">최근 경기 수</label>
      <select id="limitSelect">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
      </select>
      <button type="button" id="reloadBtn">다시 불러오기</button>
      <span id="statusText" class="status">대기 중</span>
    </section>

    <section id="matches" class="matches"></section>
  </main>

  <template id="matchCardTemplate">
    <article class="match-card">
      <div class="match-top">
        <div class="teams"></div>
        <div class="score"></div>
      </div>
      <div class="meta"></div>
      <div class="outcomes-strip" aria-label="예측 승률"></div>
      <div class="stats"></div>
      <div class="match-actions">
        <button type="button" class="btn-detail">예측 · 팀 스탯 · 라인업</button>
      </div>
      <div class="detail-panel" hidden>
        <div class="detail-loading">불러오는 중…</div>
        <div class="detail-content" hidden></div>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
